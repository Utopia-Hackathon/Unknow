name: check

# 工程门禁：build / assets / data / engine 四个 job。
# 边界：只做校验，不做部署；CI 绿 ≠ 验收绿（见 docs/CONTRACTS.md §八）。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: build · vite 生产构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx vite build

  assets:
    name: assets · 格式/体积/文件名
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-assets.mjs

  data:
    name: data · 数据结构校验（stores / field-log）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: stores.json 结构
        run: node scripts/check-stores.mjs
      - name: field-collection-log.json 结构（现场回填前允许 null，回填后必须合法）
        run: node scripts/check-field-log.mjs

  engine:
    name: engine · 决策引擎契约与单测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 引擎单测
        run: node --test src/engine/__tests__/*.test.mjs
      - name: 引擎契约检查
        run: node scripts/check-engine-contract.mjs --require
